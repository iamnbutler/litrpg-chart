name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check pipeline + contract
        run: bun run check:pipeline

      - name: Tests
        run: bun run test

      - name: Export static data from committed corpus
        run: bun run pipeline export

      - name: Type-check web
        run: bun run check:web

      - name: Build web
        run: bun run build
