name: Update data

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: 'API request budget for this run'
        type: number
        default: 600

permissions:
  contents: write
  issues: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run pipeline
        id: pipeline
        run: bun run pipeline run --budget ${{ inputs.budget || 600 }}

      - name: Commit data
        id: commit
        run: |
          git config user.name "litrpg-chart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          SUMMARY=$(python3 -c "
          import json
          s = json.load(open('data/snapshots/last-run.json'))
          d = s.get('discover') or {}
          c = s.get('closeSeries') or {}
          h = s.get('hydrate') or {}
          parts = []
          if d.get('newBooks'): parts.append(f\"+{d['newBooks']} discovered\")
          if c.get('newVolumes'): parts.append(f\"+{c['newVolumes']} series volumes\")
          if h.get('hydrated'): parts.append(f\"{h['hydrated']} hydrated\")
          if s.get('throttled'): parts.append('THROTTLED early')
          print(', '.join(parts) or 'metadata refresh')
          ")
          git commit -m "data: ${SUMMARY} (${{ github.run_id }})"
          git push
        # The weekly push doubles as cron keepalive: GitHub disables schedules
        # after 60 days without repo activity, which is how v1 died.

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data pipeline failing';
            const body = `The scheduled data run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nIf this keeps failing, the weekly cron may eventually be auto-disabled for repo inactivity (no data commits = no activity).`;
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'data-pipeline'
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['data-pipeline'] });
            }
