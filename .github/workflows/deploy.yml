name: Deploy to GitHub Pages

# Deploys are a pure function of the repo: export from the committed corpus,
# build, publish. No network fetches, no caches to evict. Data freshness is
# data.yml's job; its weekly commit triggers this workflow automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Export static data from committed corpus
        run: bun run pipeline export

      - name: Build site
        run: bun run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
